agents:
  - id: log_analyzer
    role: Log Analysis Orchestrator
    goal: Analyze system logs and generate reports
    instruction: "Coordinate with log_collector to gather logs, then with report_generator to create analysis"
    tools: [python]
    sub_agents:
      - log_collector
      - report_generator

  - id: log_collector
    role: Log Collector
    goal: Collect and search system logs
    instruction: "Use bash to find log files, search for errors/warnings, and extract relevant data. Examples: [TOOL: bash | {\"command\": \"find . -name '*.log' -type f\"}], [TOOL: bash | {\"command\": \"grep -i 'error' system.log\"}], [TOOL: bash | {\"command\": \"tail -100 application.log\"}]"
    tools: [bash, fileread]

  - id: report_generator
    role: Report Generator
    goal: Generate analysis reports from collected logs
    instruction: "Use python to process the log data and generate statistical analysis and summary reports"
    tools: [python, calculator]

workflow:
  type: sequential
  steps:
    - agent: log_analyzer

---

# Alternative Use Case: Git Repository Analyzer
agents:
  - id: repo_analyzer
    role: Repository Analysis Orchestrator
    goal: Analyze git repository structure and activity
    tools: [python]
    sub_agents:
      - repo_scanner
      - metrics_calculator

  - id: repo_scanner
    role: Repository Scanner
    goal: Scan repository structure and extract data
    instruction: "Use bash to list files, find specific types, check git status, and extract repository information. Examples: [TOOL: bash | {\"command\": \"find . -name '*.js' -type f | wc -l\"}], [TOOL: bash | {\"command\": \"git log --oneline -20\"}], [TOOL: bash | {\"command\": \"find . -type f -name '*.md'\"}]"
    tools: [bash, fileread]

  - id: metrics_calculator
    role: Metrics Calculator
    goal: Calculate repository metrics
    instruction: "Use python to analyze the scanned data and calculate metrics like file counts, commit frequency, code distribution"
    tools: [python, calculator]

workflow:
  type: sequential
  steps:
    - agent: repo_analyzer

---

# Alternative Use Case: System Health Monitor
agents:
  - id: health_orchestrator
    role: System Health Orchestrator
    goal: Monitor system health and report issues
    tools: [python]
    sub_agents:
      - health_checker
      - issue_reporter

  - id: health_checker
    role: System Health Checker
    goal: Check system resources and health metrics
    instruction: "Use bash to check disk usage, memory, processes, and system status. Examples: [TOOL: bash | {\"command\": \"df -h\"}], [TOOL: bash | {\"command\": \"free -h\"}], [TOOL: bash | {\"command\": \"ps aux --sort=-%cpu | head -10\"}], [TOOL: bash | {\"command\": \"uptime\"}]"
    tools: [bash]

  - id: issue_reporter
    role: Issue Reporter
    goal: Generate health reports and alerts
    instruction: "Use python to analyze health metrics, identify issues, and generate alerts"
    tools: [python, calculator]

workflow:
  type: sequential
  steps:
    - agent: health_orchestrator

---

# Alternative Use Case: File Organization System
agents:
  - id: file_organizer
    role: File Organization Manager
    goal: Organize and categorize files
    tools: [bash, python]
    sub_agents:
      - file_scanner
      - categorizer

  - id: file_scanner
    role: File Scanner
    goal: Scan directory structure and identify files
    instruction: "Use bash to find files by type, size, and date. Examples: [TOOL: bash | {\"command\": \"find . -type f -name '*.pdf'\"}], [TOOL: bash | {\"command\": \"find . -type f -size +1M\"}], [TOOL: bash | {\"command\": \"find . -type f -mtime -7\"}]"
    tools: [bash, fileread]

  - id: categorizer
    role: File Categorizer
    goal: Categorize and generate reports
    instruction: "Use python to categorize files and generate organization statistics"
    tools: [python, calculator]

workflow:
  type: sequential
  steps:
    - agent: file_organizer
